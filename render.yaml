# Render blueprint for the CritiTrack API.
#
# Cloud Functions needs a billed Firebase plan, so the backend runs here
# as a plain Node service instead. Everything it needs is an environment
# variable; the secret ones are set in the Render dashboard, not here.
#
# One-time setup, after connecting this repo to Render:
#   1. Render picks up this file and creates the service.
#   2. In the service's Environment tab, set the five secret values
#      listed below (sync: false means Render will not manage them).
#   3. The public URL Render assigns is what the web app is pointed at,
#      via --dart-define=API_BASE_URL at build time.

services:
  - type: web
    name: crititrack-api
    runtime: node
    plan: free
    rootDir: functions
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # ── Set these in the Render dashboard ──────────────────────────
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false          # the full service-account JSON, one line
      - key: GROQ_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: REFRESH_SECRET
        sync: false          # any random string; the cron presents it
      # Optional. Set to "false" to run before the reCAPTCHA / App Check
      # setup is done — see docs/DEPLOY_BACKEND.md. Leave unset once a
      # RECAPTCHA_SITE_KEY build is live.
      - key: APP_CHECK_ENFORCED
        sync: false
