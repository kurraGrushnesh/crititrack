name: crititrack
description: "CritiTrack — AI-powered celebrity criticism & controversy tracker with sentiment analysis."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  # Web-only, and imported only from the web branch of
  # lib/core/platform/url_strategy.dart. Declared so the analyzer
  # stops flagging it as an undeclared dependency.
  flutter_web_plugins:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_app_check: ^0.4.7
  cloud_firestore: ^6.9.0
  google_sign_in: ^6.2.2

  # HTTP & Networking
  http: ^1.3.0

  # Charts
  fl_chart: ^0.70.2

  # UI & Animation
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.1

  # Local Storage
  hive_flutter: ^1.1.0

  # WebView
  webview_flutter: ^4.12.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  equatable: ^2.0.7

  # Icons
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # No `assets:` block: the app bundles no images, animations or fonts.
  # Declaring a directory that holds nothing forces an empty folder to be
  # kept alive purely to stop the build failing. See docs/FONTS.md for
  # why the typeface is the platform default rather than a bundled one.
