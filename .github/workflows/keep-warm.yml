name: keep-warm

# Render's free tier sleeps a service after 15 minutes with no traffic,
# and the cold start that follows takes ~35s -- long enough that the
# first search of a session looks broken. This pings the health endpoint
# often enough that the service rarely gets to sleep.
#
# GitHub coalesces and sometimes delays scheduled runs, so the effective
# interval is looser than the cron says. That is fine: an occasional
# cold start is the worst case, not an outage. Trigger it by hand from
# the Actions tab any time with "Run workflow".
#
# Scheduled workflows are disabled automatically after 60 days without a
# push to the repository. Push anything to re-enable.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health endpoint
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 90 --retry 2 --retry-delay 10 \
            https://crititrack-api.onrender.com/health)
          echo "health -> $code"
          test "$code" = "200"
