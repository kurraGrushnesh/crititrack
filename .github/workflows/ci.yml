name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  quality:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze (warnings and infos are failures)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  functions:
    name: Functions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npx eslint .
        working-directory: functions
      - name: Run functions tests
        run: npm test
        working-directory: functions
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: functions

  build-web:
    name: Build web · scan for secrets
    runs-on: ubuntu-latest
    needs: [quality, functions]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release

      # SEC-01 regression gate. A credential must never reach a build
      # artifact again. This fails the build if a key-shaped string or a
      # stray .env appears anywhere in build/web.
      - name: Scan build output for secrets
        run: |
          set -e
          echo "Scanning build/web for credential patterns..."
          PATTERNS='gsk_[A-Za-z0-9]{20}|AIza[A-Za-z0-9_-]{30}|IGQ[A-Za-z0-9_-]{20}|sk-[A-Za-z0-9]{20}|GROQ_API_KEY|NEWS_API_KEY|YOUTUBE_API_KEY|INSTAGRAM_ACCESS_TOKEN'
          if grep -rEl "$PATTERNS" build/web \
               --exclude=firebase_options.dart 2>/dev/null | grep . ; then
            echo "::error::Credential-shaped string found in build output. See SEC-01."
            exit 1
          fi
          if find build/web -name '.env*' | grep . ; then
            echo "::error::A .env file was bundled into the build output. See SEC-01."
            exit 1
          fi
          echo "Clean: no credentials in build output."

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
