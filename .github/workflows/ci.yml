name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  FLUTTER_VERSION: '3.41.6'

jobs:
  quality:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The app reads config from .env at startup; CI needs a placeholder
      # so tests that touch startup code don't fail on a missing file.
      - name: Create placeholder .env
        run: cp .env.example .env

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze (warnings and infos are failures)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Create placeholder .env
        run: cp .env.example .env

      # --web-renderer was removed in Flutter 3.29; renderer is auto/config now.
      - name: Build web
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
