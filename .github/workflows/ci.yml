name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

env:
  # Must match the SDK the project is developed on. `dart format` changed
  # its wrapping rules between 3.41 and 3.47, so a mismatch here fails the
  # format gate no matter which version the files were written with.
  FLUTTER_VERSION: '3.47.2'

jobs:
  quality:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze (warnings and infos are failures)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      # A floor that holds, rather than a number that was true once.
      # lib/core/ is held to a higher bar than the whole project: it holds
      # the deterministic logic where a regression is silent.
      - name: Coverage gate
        run: dart run tool/check_coverage.dart

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  functions:
    name: Functions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - run: npx eslint .
        working-directory: functions
      - name: Run functions tests
        run: npm test
        working-directory: functions
      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: functions

  build-web:
    name: Build web · scan for secrets
    runs-on: ubuntu-latest
    needs: [quality, functions]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release

      # SEC-01 regression gate. A credential must never reach a build
      # artifact again. The script is checked in so the same check runs
      # locally: bash tool/scan_build_secrets.sh build/web
      - name: Scan build output for secrets
        run: bash tool/scan_build_secrets.sh build/web

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
